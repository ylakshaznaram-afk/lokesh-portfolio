<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D lab (dev only)</title>
    <style>
      html, body { margin: 0; background: var(--bg, #080b10); color: #f3f5f7; font: 12px/1.4 ui-monospace, monospace; }
      #stage { position: relative; margin: 0; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .hs { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
      .hs i { display: block; width: 8px; height: 8px; border-radius: 50%; background: #ff4d8d; box-shadow: 0 0 0 2px #080b10; margin: 0 auto 2px; }
      #info { position: fixed; left: 8px; bottom: 8px; opacity: .7; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="info"></div>
    <script type="module" src="/src/lab/main.ts"></script>
  </body>
</html>
